spawn:
  world: world
  x: 137.517
  y: 70.0
  z: -46.536
  yaw: 0.0
  pitch: 0.0

# MOTD da lista de servidores. Cores com &0-&9, &a-&f; formatos &l &o &n &m &k; &r repõe.
motd:
  line1: "&6&lFlawless &7- &aServidor de testes"
  line2: "&eBem-vindo!"

# Mensagem enviada ao jogador quando entra. {player} = nome. Vazio = sem mensagem.
welcome-message: "&6Bem-vindo ao servidor, &e{player}&6!"

# Mensagem enviada a todos quando um jogador sai. {player} = nome. Vazio = sem mensagem.
quit-message: ""

# Mensagens de morte. {player} = quem morreu, {killer} = quem matou. Vazio = sem mensagem.
# death-message: qualquer morte sem jogador assassino; kill-message: morto por outro jogador.
death-message: "&c☠ &7{player} &cmorreu"
kill-message: "&c☠ &7{player} &cfoi morto por &7{killer}"

# Mensagens automáticas enviadas a todos os jogadores online (autenticados ou não).
# interval em segundos; random: false = por ordem, true = aleatória. Mudanças pedem /reload.
auto-messages:
  enabled: true
  interval: 300
  random: false
  prefix: "&6[Aviso] &r"
  messages:
    - "&eBem-vindo ao servidor! Usa &6/comandos &epara ver os comandos."
    - "&eRespeita os outros jogadores."

# Confirmação ao largar itens (Q). Cada jogador escolhe em /prefs: especiais, todos ou nenhum.
# window-seconds: tempo para carregar em Q outra vez; materials: itens "especiais" além dos
# personalizados do fCustomItems; message: {item} = nome, {seconds} = janela. Precisa do fPrefs.
drop-confirm:
  window-seconds: 10
  materials: [DIAMOND, NETHERITE_INGOT, ELYTRA, TOTEM_OF_UNDYING]
  message: "&eCarrega em Q outra vez em {seconds}s para dropar &f{item}&e."
