name: fServerCore
main: pt.flawless.fServerCore.FServerCore
api-version: '1.21'
version: 1.0
description: Plugin that handles base server funcionalities
depend: [fAPI]
commands:
  setspawn:
    description: Define o spawn do servidor na tua posição
    usage: /setspawn
    permission: fservercore.setspawn
  spawn:
    description: Teleporta para o spawn do servidor
    usage: /spawn
permissions:
  fservercore.setspawn:
    description: Permite usar /setspawn
    default: op
